<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobiface - Social Content Platform</title>
    <meta name="description" content="Connect, share, and discover amazing content with Mobiface - Your premier social content platform">
    <meta name="author" content="Mobiface" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/mobiface-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/mobiface-favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Theme & Manifest -->
    <meta name="theme-color" content="#DA251D" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph (static fallback - dynamic injection below) -->
    <meta property="og:site_name" content="Mobiface" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mobiface - Social Content Platform">
    <meta property="og:description" content="Connect, share, and discover amazing content with Mobiface - Your premier social content platform">
    <meta property="og:image" content="https://mobi-gate-com.lovable.app/mobiface-favicon.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:alt" content="Mobiface Logo">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@mobiface" />
    <meta name="twitter:title" content="Mobiface - Social Content Platform">
    <meta name="twitter:description" content="Connect, share, and discover amazing content with Mobiface - Your premier social content platform">
    <meta name="twitter:image" content="https://mobi-gate-com.lovable.app/mobiface-favicon.png">
    <meta name="twitter:image:alt" content="Mobiface Logo">

    <!-- Dynamic URL injection for SPA -->
    <script>
      (function() {
        var url = window.location.href;
        var origin = window.location.origin;
        var link = document.createElement('link');
        link.rel = 'canonical';
        link.href = url;
        document.head.appendChild(link);
        var ogUrl = document.createElement('meta');
        ogUrl.setAttribute('property', 'og:url');
        ogUrl.content = url;
        document.head.appendChild(ogUrl);
        var twUrl = document.createElement('meta');
        twUrl.setAttribute('property', 'twitter:url');
        twUrl.content = url;
        document.head.appendChild(twUrl);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
